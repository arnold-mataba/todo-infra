AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time bootstrap: GitHub OIDC provider + IAM roles (infra-deploy, app-build, ecr-deploy),
  and the S3 bucket `aws cloudformation package` uploads root.yaml's nested child templates to.
  Must be deployed once manually (local/console credentials) before any GitHub Actions workflow
  can run — see README "One-time bootstrap" section. network/data/cache/ecs/pipeline are
  deployed as real nested stacks under todo-infra's templates/root.yaml (via InfraDeployRole);
  ECR is deployed as its own standalone stack in the separate todo-ecr repo (via EcrDeployRole).

Parameters:
  EnvironmentName:
    Type: String
    Default: todo-dev
    Description: Namespacing prefix used for resource names across all stacks.

  GitHubOwnerId:
    Type: String
    Description: >
      Numeric GitHub owner (org/user) ID. Stable across org/repo renames, unlike the
      "owner/repo" string. Obtain with: gh api users/<owner> --jq .id (or orgs/<owner>).

  GitHubOwner:
    Type: String
    Description: >
      GitHub org/user login (e.g. "arnold-mataba"). IAM now requires every OIDC trust policy to
      include a `sub`/`job_workflow_ref` condition that isn't wildcarded to everything, even
      when repository_id/repository_owner_id are already present — this is used to build that
      required `sub` condition alongside the ID-based ones. Verified empirically (via CloudTrail
      on a failed AssumeRoleWithWebIdentity) that this environment's actual `sub` claim format is
      "repo:{owner}@{owner_id}/{repo}@{repo_id}:ref:refs/heads/{branch}" — not the plain GitHub
      docs format "repo:{owner}/{repo}:ref:..." — so the condition must match that exact shape.

  InfraRepositoryId:
    Type: String
    Description: >
      Numeric GitHub repository ID for todo-infra. Obtain with:
      gh api repos/<owner>/todo-infra --jq .id

  AppRepositoryId:
    Type: String
    Description: >
      Numeric GitHub repository ID for todo-app. Obtain with:
      gh api repos/<owner>/todo-app --jq .id

  EcrRepositoryId:
    Type: String
    Description: >
      Numeric GitHub repository ID for todo-ecr. Obtain with:
      gh api repos/<owner>/todo-ecr --jq .id

  ECRRepositoryName:
    Type: String
    Default: todo-app
    Description: >
      Fixed name used to construct the ECR repo ARN here and to actually create the repo in
      the separate todo-ecr repo's stack. Deterministic naming avoids a cross-stack/cross-repo
      dependency cycle at bootstrap time.

  ArtifactBucketName:
    Type: String
    Description: >
      Fixed S3 deploy-artifact bucket name (must be globally unique), constructed the same way
      here and passed into root.yaml — e.g. todo-app-pipeline-artifacts-123456789012.

  TemplateBucketName:
    Type: String
    Description: >
      Fixed S3 bucket name for `aws cloudformation package` to stage root.yaml's nested child
      templates in (must be globally unique) — e.g. todo-app-cfn-templates-123456789012.

Resources:
  TemplateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref TemplateBucketName
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      Tags: [{ Key: Project, Value: !Ref EnvironmentName }]

  InfraDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-infra-deploy-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:repository_id: !Ref InfraRepositoryId
                token.actions.githubusercontent.com:repository_owner_id: !Ref GitHubOwnerId
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/todo-infra@${InfraRepositoryId}:*"
      Policies:
        - PolicyName: cloudformation-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationOnTodoStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:ListStackResources
                  - cloudformation:ValidateTemplate
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${EnvironmentName}-*/*"
              - Sid: IamOnTodoRolesOnly
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:CreateServiceLinkedRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${EnvironmentName}-*"
              - Sid: TemplateBucketAccess
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt TemplateBucket.Arn
                  - !Sub "${TemplateBucket.Arn}/*"
              - Sid: ProvisioningServices
                Effect: Allow
                Action:
                  - ec2:*
                  - rds:*
                  - elasticache:*
                  - ecs:*
                  - ecr:*
                  - elasticloadbalancing:*
                  - application-autoscaling:*
                  - codepipeline:*
                  - codedeploy:*
                  - events:*
                  - logs:*
                  - s3:*
                  - secretsmanager:*
                  - cloudwatch:*
                Resource: "*"

  AppBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-app-build-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:repository_id: !Ref AppRepositoryId
                token.actions.githubusercontent.com:repository_owner_id: !Ref GitHubOwnerId
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/todo-app@${AppRepositoryId}:*"
      Policies:
        - PolicyName: ecr-push-and-artifact-upload
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPushToTodoAppRepo
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:BatchGetImage
                  - ecr:DescribeRepositories
                Resource:
                  - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ECRRepositoryName}"
              - Sid: UploadDeployArtifact
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetBucketLocation
                Resource:
                  - !Sub "arn:aws:s3:::${ArtifactBucketName}"
                  - !Sub "arn:aws:s3:::${ArtifactBucketName}/*"

  EcrDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-ecr-deploy-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:repository_id: !Ref EcrRepositoryId
                token.actions.githubusercontent.com:repository_owner_id: !Ref GitHubOwnerId
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/todo-ecr@${EcrRepositoryId}:*"
      Policies:
        - PolicyName: deploy-ecr-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationOnEcrStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:ListStackResources
                  - cloudformation:ValidateTemplate
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${EnvironmentName}-ecr*/*"
              - Sid: ManageEcrRepository
                Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DeleteRepository
                  - ecr:DescribeRepositories
                  - ecr:PutLifecyclePolicy
                  - ecr:GetLifecyclePolicy
                  - ecr:DeleteLifecyclePolicy
                  - ecr:PutImageScanningConfiguration
                  - ecr:PutImageTagMutability
                  - ecr:TagResource
                  - ecr:UntagResource
                  - ecr:ListTagsForResource
                Resource:
                  - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ECRRepositoryName}"

Outputs:
  InfraDeployRoleArn:
    Value: !GetAtt InfraDeployRole.Arn
  AppBuildRoleArn:
    Value: !GetAtt AppBuildRole.Arn
  EcrDeployRoleArn:
    Value: !GetAtt EcrDeployRole.Arn
  TemplateBucketName:
    Value: !Ref TemplateBucketName
  ECRRepositoryName:
    Value: !Ref ECRRepositoryName
  ArtifactBucketName:
    Value: !Ref ArtifactBucketName
