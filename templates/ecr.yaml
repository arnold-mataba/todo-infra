AWSTemplateFormatVersion: "2010-09-09"
Description: ECR repository for the To-Do app container image.

Parameters:
  EnvironmentName:
    Type: String
    Default: todo-dev
  ECRRepositoryName:
    Type: String
    Default: todo-app
    Description: Must match the name used in bootstrap.yaml's IAM policy ARN construction.

Resources:
  AppRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ECRRepositoryName
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: >
          {"rules":[{"rulePriority":1,"description":"Keep last 15 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":15},
          "action":{"type":"expire"}}]}
      Tags:
        - Key: Project
          Value: !Ref EnvironmentName

Outputs:
  RepositoryUri:
    Value: !GetAtt AppRepository.RepositoryUri
  RepositoryArn:
    Value: !GetAtt AppRepository.Arn
  RepositoryName:
    Value: !Ref ECRRepositoryName
