AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Root stack for the To-Do app. Nests network/data/cache/ecs/pipeline as real
  AWS::CloudFormation::Stack children, wired via Fn::GetAtt on sibling Outputs, not Export/
  Fn::ImportValue. Deploy with `aws cloudformation package` then `deploy` — see README.
  bootstrap.yaml (OIDC roles + template bucket) deploys separately, first. ECR lives in its
  own repo (todo-ecr) and its own standalone stack — not nested here at all — so this root
  stack only ever references the ECR repository by name (ECRRepositoryName), never creates it.

  EcsStack/PipelineStack only get created once InitialImageUri is set to a real pushed image
  (HasInitialImage condition) — leave it empty on the first deploy (foundation only, no
  placeholder image anywhere), then redeploy once a real image exists. See README.

Parameters:
  EnvironmentName:
    Type: String
    Default: todo-dev
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  ContainerPort:
    Type: Number
    Default: 8080
  ECRRepositoryName:
    Type: String
    Default: todo-app
  DBName:
    Type: String
    Default: tododb
  MasterUsername:
    Type: String
    Default: todoadmin
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
  AllocatedStorage:
    Type: Number
    Default: 20
  CacheNodeType:
    Type: String
    Default: cache.t3.micro
  RedisEngineVersion:
    Type: String
    Default: "7.1"
  TaskCpu:
    Type: String
    Default: "512"
  TaskMemory:
    Type: String
    Default: "1024"
  InitialImageUri:
    Type: String
    Default: ""
    Description: >
      Real ECR image URI (repo:tag). Leave empty on the first deploy (foundation only, no
      ECS/pipeline); set once a real image has been pushed to create EcsStack/PipelineStack.
  MinTaskCount:
    Type: Number
    Default: 1
  DesiredTaskCount:
    Type: Number
    Default: 1
  MaxTaskCount:
    Type: Number
    Default: 4
  CpuScalingTargetPercent:
    Type: Number
    Default: 60
  ArtifactBucketName:
    Type: String
    Description: Must match the value used in bootstrap.yaml.
  DeployArtifactKey:
    Type: String
    Default: deploy-artifacts/artifacts.zip

Conditions:
  HasInitialImage: !Not [!Equals [!Ref InitialImageUri, ""]]

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./network.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcCidr: !Ref VpcCidr
        ContainerPort: !Ref ContainerPort
      Tags: [{ Key: Project, Value: !Ref EnvironmentName }]

  DataStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./data.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        DBName: !Ref DBName
        MasterUsername: !Ref MasterUsername
        DBInstanceClass: !Ref DBInstanceClass
        AllocatedStorage: !Ref AllocatedStorage
        PrivateDataSubnetIds: !GetAtt NetworkStack.Outputs.PrivateDataSubnetIds
        RdsSecurityGroupId: !GetAtt NetworkStack.Outputs.RdsSecurityGroupId
        RdsProxySecurityGroupId: !GetAtt NetworkStack.Outputs.RdsProxySecurityGroupId
      Tags: [{ Key: Project, Value: !Ref EnvironmentName }]

  CacheStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./cache.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        CacheNodeType: !Ref CacheNodeType
        EngineVersion: !Ref RedisEngineVersion
        PrivateCacheSubnetIds: !GetAtt NetworkStack.Outputs.PrivateCacheSubnetIds
        RedisSecurityGroupId: !GetAtt NetworkStack.Outputs.RedisSecurityGroupId
      Tags: [{ Key: Project, Value: !Ref EnvironmentName }]

  EcsStack:
    Type: AWS::CloudFormation::Stack
    Condition: HasInitialImage
    Properties:
      TemplateURL: ./ecs.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        ContainerPort: !Ref ContainerPort
        TaskCpu: !Ref TaskCpu
        TaskMemory: !Ref TaskMemory
        ImageUri: !Ref InitialImageUri
        MinTaskCount: !Ref MinTaskCount
        DesiredTaskCount: !Ref DesiredTaskCount
        MaxTaskCount: !Ref MaxTaskCount
        CpuScalingTargetPercent: !Ref CpuScalingTargetPercent
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnetIds: !GetAtt NetworkStack.Outputs.PublicSubnetIds
        PrivateEcsSubnetIds: !GetAtt NetworkStack.Outputs.PrivateEcsSubnetIds
        AlbSecurityGroupId: !GetAtt NetworkStack.Outputs.AlbSecurityGroupId
        EcsSecurityGroupId: !GetAtt NetworkStack.Outputs.EcsSecurityGroupId
        DbSecretArn: !GetAtt DataStack.Outputs.DBSecretArn
      Tags: [{ Key: Project, Value: !Ref EnvironmentName }]

  PipelineStack:
    Type: AWS::CloudFormation::Stack
    Condition: HasInitialImage
    Properties:
      TemplateURL: ./pipeline.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        ArtifactBucketName: !Ref ArtifactBucketName
        DeployArtifactKey: !Ref DeployArtifactKey
        EcrRepositoryName: !Ref ECRRepositoryName
        ServiceName: !GetAtt EcsStack.Outputs.ServiceName
        ClusterName: !GetAtt EcsStack.Outputs.ClusterName
        ListenerArn: !GetAtt EcsStack.Outputs.ListenerArn
        TargetGroupBlueName: !GetAtt EcsStack.Outputs.TargetGroupBlueName
        TargetGroupGreenName: !GetAtt EcsStack.Outputs.TargetGroupGreenName
        TaskExecutionRoleArn: !GetAtt EcsStack.Outputs.TaskExecutionRoleArn
        TaskRoleArn: !GetAtt EcsStack.Outputs.TaskRoleArn
      Tags: [{ Key: Project, Value: !Ref EnvironmentName }]

Outputs:
  AlbDnsName:
    Value: !If [HasInitialImage, !GetAtt EcsStack.Outputs.AlbDnsName, "not created yet - see InitialImageUri"]
  ClusterName:
    Value: !If [HasInitialImage, !GetAtt EcsStack.Outputs.ClusterName, "not created yet - see InitialImageUri"]
  ServiceName:
    Value: !If [HasInitialImage, !GetAtt EcsStack.Outputs.ServiceName, "not created yet - see InitialImageUri"]
  TaskExecutionRoleArn:
    Value: !If [HasInitialImage, !GetAtt EcsStack.Outputs.TaskExecutionRoleArn, "not created yet - see InitialImageUri"]
  TaskRoleArn:
    Value: !If [HasInitialImage, !GetAtt EcsStack.Outputs.TaskRoleArn, "not created yet - see InitialImageUri"]
  TaskDefinitionFamily:
    Value: !If [HasInitialImage, !GetAtt EcsStack.Outputs.TaskDefinitionFamily, "not created yet - see InitialImageUri"]
  AppLogGroupName:
    Value: !If [HasInitialImage, !GetAtt EcsStack.Outputs.AppLogGroupName, "not created yet - see InitialImageUri"]
  DjangoSecretKeyArn:
    Value: !If [HasInitialImage, !GetAtt EcsStack.Outputs.DjangoSecretKeyArn, "not created yet - see InitialImageUri"]
  DbProxyEndpoint:
    Value: !GetAtt DataStack.Outputs.DBProxyEndpoint
  DbName:
    Value: !GetAtt DataStack.Outputs.DBName
  DbSecretArn:
    Value: !GetAtt DataStack.Outputs.DBSecretArn
  RedisPrimaryEndpointAddress:
    Value: !GetAtt CacheStack.Outputs.RedisPrimaryEndpointAddress
  RedisPrimaryEndpointPort:
    Value: !GetAtt CacheStack.Outputs.RedisPrimaryEndpointPort
  ArtifactBucketName:
    Value: !Ref ArtifactBucketName
