AWSTemplateFormatVersion: "2010-09-09"
Description: >
  RDS PostgreSQL (Multi-AZ) behind RDS Proxy, in the dedicated private-data subnets. The app
  only ever talks to the proxy endpoint (enforced by RdsSecurityGroupId ingress in network.yaml).
  Master credentials live in a self-managed DbCredentialsSecret (deterministic name) rather than
  RDS's own ManageMasterUserPassword feature, so the app's task definition can reference the
  secret by a static, hardcodable partial ARN instead of an unpredictable rds!db-<uuid> name —
  the tradeoff is no automatic password rotation (a documented lab-scope simplification).

Parameters:
  EnvironmentName:
    Type: String
    Default: todo-dev
  DBName:
    Type: String
    Default: tododb
  MasterUsername:
    Type: String
    Default: todoadmin
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
  AllocatedStorage:
    Type: Number
    Default: 20
  PrivateDataSubnetIds:
    Type: String
    Description: Comma-joined subnet IDs, passed down from root.yaml's NetworkStack output.
  RdsSecurityGroupId:
    Type: String
  RdsProxySecurityGroupId:
    Type: String

Resources:
  DbCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}-db-credentials"
      Description: RDS master credentials, deterministic name so the app's task definition can reference it as a static ARN.
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${MasterUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref EnvironmentName

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private data subnets for RDS + RDS Proxy
      SubnetIds: !Split
        - ","
        - !Ref PrivateDataSubnetIds

  DBInstance:
    Type: AWS::RDS::DBInstance
    DependsOn: DbCredentialsSecret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: postgres
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref AllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: true
      DBName: !Ref DBName
      MasterUsername: !Ref MasterUsername
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${EnvironmentName}-db-credentials:SecretString:password}}"
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroupId
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: false
      Tags:
        - Key: Project
          Value: !Ref EnvironmentName

  RDSProxyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-rds-proxy-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-db-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DbCredentialsSecret

  DBProxy:
    Type: AWS::RDS::DBProxy
    Properties:
      DBProxyName: !Sub "${EnvironmentName}-rds-proxy"
      EngineFamily: POSTGRESQL
      RoleArn: !GetAtt RDSProxyRole.Arn
      RequireTLS: true
      VpcSubnetIds: !Split
        - ","
        - !Ref PrivateDataSubnetIds
      VpcSecurityGroupIds:
        - !Ref RdsProxySecurityGroupId
      Auth:
        - AuthScheme: SECRETS
          IAMAuth: DISABLED
          SecretArn: !Ref DbCredentialsSecret
      Tags:
        - Key: Project
          Value: !Ref EnvironmentName

  DBProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    Properties:
      DBProxyName: !Ref DBProxy
      TargetGroupName: default
      DBInstanceIdentifiers:
        - !Ref DBInstance

  DbProxyEndpointParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${EnvironmentName}/db-proxy-endpoint"
      Type: String
      Value: !GetAtt DBProxy.Endpoint

  DbPortParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${EnvironmentName}/db-port"
      Type: String
      Value: "5432"

  DbNameParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${EnvironmentName}/db-name"
      Type: String
      Value: !Ref DBName

Outputs:
  DBInstanceEndpoint:
    Value: !GetAtt DBInstance.Endpoint.Address
  DBProxyEndpoint:
    Value: !GetAtt DBProxy.Endpoint
  DBSecretArn:
    Value: !Ref DbCredentialsSecret
  DBName:
    Value: !Ref DBName
