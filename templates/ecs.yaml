AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ECS Fargate cluster/service behind a public ALB, with blue/green target groups for
  CodeDeploy and CPU-based auto scaling (1-4 tasks). Nested under root.yaml — every
  cross-tier value (VPC, subnets, security groups, DB/Redis endpoints) arrives as a
  Parameter passed down from root.yaml via Fn::GetAtt on sibling nested stacks, not via
  Fn::ImportValue.

  Bootstrap note: the task definition below points at a public placeholder image (the real
  app image doesn't exist in ECR until the first CI push). The ALB target group will show
  unhealthy targets until the first CodeDeploy blue/green deployment substitutes the real
  todo-app image — this is expected, not a failure, and is why deploying the pipeline child
  stack and triggering the app workflow is a required next step, not optional polish.

Parameters:
  EnvironmentName:
    Type: String
    Default: todo-dev
  ContainerPort:
    Type: Number
    Default: 8080
  TaskCpu:
    Type: String
    Default: "512"
  TaskMemory:
    Type: String
    Default: "1024"
  PlaceholderImage:
    Type: String
    Default: public.ecr.aws/docker/library/httpd:2.4
    Description: Bootstrap-only image so the service/target group can be created before CI exists.
  MinTaskCount:
    Type: Number
    Default: 1
  DesiredTaskCount:
    Type: Number
    Default: 1
  MaxTaskCount:
    Type: Number
    Default: 4
  CpuScalingTargetPercent:
    Type: Number
    Default: 60
  VpcId:
    Type: String
  PublicSubnetIds:
    Type: String
    Description: Comma-joined subnet IDs.
  PrivateEcsSubnetIds:
    Type: String
    Description: Comma-joined subnet IDs.
  AlbSecurityGroupId:
    Type: String
  EcsSecurityGroupId:
    Type: String
  DbSecretArn:
    Type: String
  DbProxyEndpoint:
    Type: String
  DbName:
    Type: String
  RedisPrimaryEndpointAddress:
    Type: String
  RedisPrimaryEndpointPort:
    Type: String

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${EnvironmentName}-cluster"
      ClusterSettings:
        - { Name: containerInsights, Value: enabled }
      Tags: [{ Key: Project, Value: !Ref EnvironmentName }]

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${EnvironmentName}-todo-app"
      RetentionInDays: 14

  # Django needs a SECRET_KEY. Generated here (Secrets Manager) rather than passed through
  # GitHub Actions, so the app repo never has to manage or rotate it.
  DjangoSecretKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}-django-secret-key"
      Description: Django SECRET_KEY for the todo-app container, injected as an ECS task secret.
      GenerateSecretString:
        PasswordLength: 50
        ExcludePunctuation: true
      Tags: [{ Key: Project, Value: !Ref EnvironmentName }]

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-ecs-task-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DbSecretArn
                  - !Ref DjangoSecretKeySecret

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-ecs-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      # No permissions yet: the app talks to RDS Proxy / Redis over the network, not via AWS
      # SDK calls. Add scoped policies here if the app grows a real AWS-API dependency.

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-todo-app"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: todo-app
          Image: !Ref PlaceholderImage
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: DB_PROXY_ENDPOINT
              Value: !Ref DbProxyEndpoint
            - Name: DB_PORT
              Value: "5432"
            - Name: DB_NAME
              Value: !Ref DbName
            - Name: REDIS_HOST
              Value: !Ref RedisPrimaryEndpointAddress
            - Name: REDIS_PORT
              Value: !Ref RedisPrimaryEndpointPort
          Secrets:
            - Name: DB_USERNAME
              ValueFrom: !Sub "${DbSecretArn}:username::"
            - Name: DB_PASSWORD
              ValueFrom: !Sub "${DbSecretArn}:password::"
            - Name: DJANGO_SECRET_KEY
              ValueFrom: !Ref DjangoSecretKeySecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: todo-app

  AppLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${EnvironmentName}-alb"
      Type: application
      Scheme: internet-facing
      Subnets: !Split [",", !Ref PublicSubnetIds]
      SecurityGroups:
        - !Ref AlbSecurityGroupId
      Tags: [{ Key: Project, Value: !Ref EnvironmentName }]

  TargetGroupBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${EnvironmentName}-tg-blue"
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /health/
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }

  TargetGroupGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${EnvironmentName}-tg-green"
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /health/
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AppLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroupBlue

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: !Sub "${EnvironmentName}-todo-app"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredTaskCount
      LaunchType: FARGATE
      DeploymentController: { Type: CODE_DEPLOY }
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [",", !Ref PrivateEcsSubnetIds]
          SecurityGroups:
            - !Ref EcsSecurityGroupId
      LoadBalancers:
        - ContainerName: todo-app
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroupBlue

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Sub "service/${Cluster}/${Service.Name}"
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: !Ref MinTaskCount
      MaxCapacity: !Ref MaxTaskCount

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${EnvironmentName}-cpu-target-tracking"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref CpuScalingTargetPercent
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

Outputs:
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  TaskDefinitionFamily:
    Value: !Sub "${EnvironmentName}-todo-app"
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  AlbDnsName:
    Value: !GetAtt AppLoadBalancer.DNSName
  ListenerArn:
    Value: !Ref Listener
  TargetGroupBlueArn:
    Value: !Ref TargetGroupBlue
  TargetGroupBlueName:
    Value: !GetAtt TargetGroupBlue.TargetGroupName
  TargetGroupGreenArn:
    Value: !Ref TargetGroupGreen
  TargetGroupGreenName:
    Value: !GetAtt TargetGroupGreen.TargetGroupName
  AppLogGroupName:
    Value: !Ref AppLogGroup
  DjangoSecretKeyArn:
    Value: !Ref DjangoSecretKeySecret
