name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "templates/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Package nested templates
        run: |
          aws cloudformation package \
            --template-file templates/root.yaml \
            --s3-bucket ${{ secrets.TEMPLATE_BUCKET_NAME }} \
            --s3-prefix cfn-templates \
            --output-template-file packaged-root.yaml

      - name: Determine InitialImageUri
        id: latest-image
        env:
          ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
          ECR_REPOSITORY_NAME: ${{ vars.ECR_REPOSITORY_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: ./scripts/determine-image-uri.sh

      - name: Deploy root.yaml (network, data, cache, and ecs+pipeline once an image exists)
        run: |
          aws cloudformation deploy \
            --stack-name ${{ vars.ENVIRONMENT_NAME }}-root \
            --template-file packaged-root.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EnvironmentName=${{ vars.ENVIRONMENT_NAME }} \
              ECRRepositoryName=${{ vars.ECR_REPOSITORY_NAME }} \
              ArtifactBucketName=${{ secrets.ARTIFACT_BUCKET_NAME }} \
              InitialImageUri=${{ steps.latest-image.outputs.image_uri }}

      - name: Print ALB endpoint
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${{ vars.ENVIRONMENT_NAME }}-root \
            --query "Stacks[0].Outputs[?OutputKey=='AlbDnsName'].OutputValue" \
            --output text
