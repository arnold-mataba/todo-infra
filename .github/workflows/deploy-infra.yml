name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "templates/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy bootstrap.yaml
        run: |
          aws cloudformation deploy \
            --stack-name ${{ vars.ENVIRONMENT_NAME }}-bootstrap \
            --template-file templates/bootstrap.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EnvironmentName=${{ vars.ENVIRONMENT_NAME }} \
              GitHubOwnerId=${{ secrets.GH_OWNER_ID }} \
              InfraRepositoryId=${{ secrets.INFRA_REPOSITORY_ID }} \
              AppRepositoryId=${{ secrets.APP_REPOSITORY_ID }} \
              EcrRepositoryId=${{ secrets.ECR_REPOSITORY_ID }} \
              ECRRepositoryName=${{ vars.ECR_REPOSITORY_NAME }} \
              ArtifactBucketName=${{ secrets.ARTIFACT_BUCKET_NAME }} \
              TemplateBucketName=${{ secrets.TEMPLATE_BUCKET_NAME }}

      - name: Package nested templates
        run: |
          aws cloudformation package \
            --template-file templates/root.yaml \
            --s3-bucket ${{ secrets.TEMPLATE_BUCKET_NAME }} \
            --s3-prefix cfn-templates \
            --output-template-file packaged-root.yaml

      - name: Determine InitialImageUri
        id: latest-image
        run: |
          EXISTING=$(aws cloudformation describe-stacks \
            --stack-name ${{ vars.ENVIRONMENT_NAME }}-root \
            --query "Stacks[0].Parameters[?ParameterKey=='InitialImageUri'].ParameterValue | [0]" \
            --output text 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "None" ] && [ "$EXISTING" != "" ]; then
            echo "EcsStack already exists — reusing its current InitialImageUri ($EXISTING) instead of recomputing it, since CodeDeploy owns the task definition from here on."
            echo "image_uri=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            TAG=$(aws ecr describe-images \
              --repository-name ${{ vars.ECR_REPOSITORY_NAME }} \
              --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageTags[0]' \
              --output text 2>/dev/null || true)
            if [ -z "$TAG" ] || [ "$TAG" = "None" ]; then
              echo "No image pushed yet — deploying foundation only (network/data/cache)."
              echo "image_uri=" >> "$GITHUB_OUTPUT"
            else
              echo "image_uri=${ACCOUNT_ID}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Deploy root.yaml (network, data, cache, and ecs+pipeline once an image exists)
        run: |
          aws cloudformation deploy \
            --stack-name ${{ vars.ENVIRONMENT_NAME }}-root \
            --template-file packaged-root.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EnvironmentName=${{ vars.ENVIRONMENT_NAME }} \
              ECRRepositoryName=${{ vars.ECR_REPOSITORY_NAME }} \
              ArtifactBucketName=${{ secrets.ARTIFACT_BUCKET_NAME }} \
              InitialImageUri=${{ steps.latest-image.outputs.image_uri }}

      - name: Print ALB endpoint
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${{ vars.ENVIRONMENT_NAME }}-root \
            --query "Stacks[0].Outputs[?OutputKey=='AlbDnsName'].OutputValue" \
            --output text
